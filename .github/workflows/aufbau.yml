# Check „Aufbau“ (V-32): cockpit repo pruefen against the scaffold of the cockpit; red only for hard
# errors of a repo with a scaffold. The shared workflow lies in werkzeuge.
name: Aufbau

on:
  push:
    branches: ["task/**", "vorhaben/**"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  aufbau:
    permissions:
      contents: read
      id-token: write
    uses: cloud-rust/werkzeuge/.github/workflows/aufbau.yml@main
    secrets:
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
