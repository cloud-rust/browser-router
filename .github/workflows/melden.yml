# Neuer Stand eines Pull Requests: Cockpit live startet den Neulauf, wenn die Aufgabe in der Abnahme
# steht (Befund 136). Der gemeinsame Workflow liegt in plattform; er meldet sich mit einem OIDC-Token
# von GitHub an (Befund 160) und kennt die Adresse von Cockpit live selbst (A-059).
name: Cockpit melden

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  melden:
    permissions:
      contents: read
      id-token: write
    uses: cloud-rust/werkzeuge/.github/workflows/cockpit-melden.yml@main
